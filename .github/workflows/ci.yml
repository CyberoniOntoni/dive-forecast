name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run replay

  # The Android app (android/, its own Gradle build). Unit tests and a debug APK; no device.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain testDebugUnitTest assembleDebug
      # The debug APK, to install and try a branch on a phone (Actions run page, Artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: dive-current-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
