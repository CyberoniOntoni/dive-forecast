# A signed Android App Bundle (.aab) for Google Play, signed with the upload key from GitHub secrets.
# Run it from the Actions tab (Run workflow) or by pushing a tag like android-v1.0.1; download the .aab from the
# run's Artifacts and upload it in Play Console. Secrets and how to make the keystore: android/README.md
# § Releasing to Google Play.
name: android-release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name shown in Play (e.g. 1.0.1)"
        required: true
        default: "1.0"
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name (android/README.md § Releasing to Google Play)"; exit 1; fi
          done
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A tag android-v1.2.3 names the version 1.2.3; a manual run takes the typed name.
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.versionName }}
        run: |
          VERSION_NAME="${VERSION_NAME#android-v}"
          # Play needs every upload's versionCode higher than the last: this workflow's run number always grows.
          ./gradlew --console=plain bundleRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
          # jarsigner exits 0 on an unsigned bundle ("jar is unsigned."), so require "jar verified.". Not -strict: the
          # upload key is self-signed, and -strict turns that warning into a failure.
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/verify.txt"
          grep -q "^jar verified" "$RUNNER_TEMP/verify.txt" || { echo "::error::The bundle is not signed"; exit 1; }
          echo "Built $VERSION_NAME (versionCode ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: 50bar-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
